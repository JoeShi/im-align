name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen python -m py_compile scripts/bridge.py scripts/im_align/*.py scripts/im_align/acp/*.py scripts/im_align/im_providers/*.py tests/e2e/*.py tests/unit/*.py
      - run: uv run --frozen python -m unittest discover -s tests/unit -t .
      - run: uv run --frozen python scripts/bridge.py --help
      - run: git diff --check

  # Feishu-touching layer. Serialized machine-wide against every other
  # Feishu job via the shared concurrency group: one long connection per app,
  # multiple connections shard events (AGENTS.md).
  #
  # Enable by setting the repository variable IM_ALIGN_E2E_ENABLED=true plus
  # secrets: E2E_BRIDGE_FEISHU_APP_ID, E2E_BRIDGE_FEISHU_APP_SECRET,
  # E2E_BRIDGE_CHAT_ID (dedicated test group),
  # E2E_SIMULATOR_USER_REFRESH_TOKEN (rotating OAuth credential), and
  # E2E_SIMULATOR_GITHUB_SECRETS_PAT (fine-grained, this repo, Secrets: write).
  #
  # Two entry paths:
  #   - push to main runs unattended against already-landed, reviewed code via
  #     the im-align-e2e-main environment (no required reviewers).
  #   - pull_request to main executes PR-controlled code, so it is restricted
  #     to same-repository PRs -- fork PRs run the hermetic unit job only -- and
  #     routed through the im-align-e2e-pr protected environment, whose required
  #     reviewers must approve the diff before the job starts and credentials
  #     are exposed.
  # Token rotation rewrites a shared GitHub secret and therefore stays on the
  # main path only; PR runs consume the stored token without rotating it.
  im-integration:
    needs: unit
    if: >-
      vars.IM_ALIGN_E2E_ENABLED == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'im-align-e2e-pr' || 'im-align-e2e-main' }}
    concurrency:
      group: im-align-feishu-single-session
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Refresh test-user OAuth token
        if: github.event_name == 'push'
        env:
          E2E_BRIDGE_FEISHU_APP_ID: ${{ secrets.E2E_BRIDGE_FEISHU_APP_ID }}
          E2E_BRIDGE_FEISHU_APP_SECRET: ${{ secrets.E2E_BRIDGE_FEISHU_APP_SECRET }}
          E2E_SIMULATOR_USER_REFRESH_TOKEN: ${{ secrets.E2E_SIMULATOR_USER_REFRESH_TOKEN }}
          E2E_SIMULATOR_GITHUB_SECRETS_PAT: ${{ secrets.E2E_SIMULATOR_GITHUB_SECRETS_PAT }}
        run: uv run --frozen python -m tests.e2e.refresh_user_token
      - env:
          E2E_BRIDGE_FEISHU_APP_ID: ${{ secrets.E2E_BRIDGE_FEISHU_APP_ID }}
          E2E_BRIDGE_FEISHU_APP_SECRET: ${{ secrets.E2E_BRIDGE_FEISHU_APP_SECRET }}
          E2E_BRIDGE_CHAT_ID: ${{ secrets.E2E_BRIDGE_CHAT_ID }}
        run: uv run --frozen python -m tests.e2e.im_integration tests/e2e/scenarios/todo-greenfield
