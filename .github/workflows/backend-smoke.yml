name: backend-smoke

on:
  workflow_dispatch:

jobs:
  # Real Agent Backend x real Feishu Thread with the LLM User Simulator.
  # Shares the single-session concurrency group with ci.yml's im-integration.
  #
  # Prerequisites on the runner image: opencode installed and authenticated. GitHub-hosted
  # runners do not provide them, so this job targets the self-hosted
  # `im-align-e2e` runner label with `gh`, node/npm, and the backend binaries.
  # Credentials include the as-user Participant identity, a rotating
  # refresh token plus a fine-grained GitHub Secrets: write PAT, and
  # E2E_SIMULATOR_LLM_BASE_URL/API_KEY/MODEL and E2E_EVALUATOR_LLM_BASE_URL/API_KEY/MODEL.
  # Credential-writer secrets execute
  # only the workflow revision on refs/heads/main.
  smoke:
    if: vars.IM_ALIGN_E2E_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, im-align-e2e]
    timeout-minutes: 35
    # runner.temp is not available in job-level env; resolve it in the steps
    # that consume it (GitHub rejects the file otherwise).
    concurrency:
      group: im-align-feishu-single-session
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # The smoke harness installs the Skill Bundle each Scenario declares in
      # its skill: mapping per isolated workspace. The self-hosted runner must
      # provide node/npm; bundle source, ref, and installer version are pinned
      # per Scenario, so no shared manifest is needed.
      - run: uv sync --frozen
      - name: Refresh test-user OAuth token
        env:
          E2E_BRIDGE_FEISHU_APP_ID: ${{ secrets.E2E_BRIDGE_FEISHU_APP_ID }}
          E2E_BRIDGE_FEISHU_APP_SECRET: ${{ secrets.E2E_BRIDGE_FEISHU_APP_SECRET }}
          E2E_SIMULATOR_USER_REFRESH_TOKEN: ${{ secrets.E2E_SIMULATOR_USER_REFRESH_TOKEN }}
          E2E_SIMULATOR_GITHUB_SECRETS_PAT: ${{ secrets.E2E_SIMULATOR_GITHUB_SECRETS_PAT }}
        run: uv run --frozen python -m tests.e2e.refresh_user_token
      - env:
          E2E_RUNS_DIR: ${{ runner.temp }}/im-align-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          E2E_BRIDGE_FEISHU_APP_ID: ${{ secrets.E2E_BRIDGE_FEISHU_APP_ID }}
          E2E_BRIDGE_FEISHU_APP_SECRET: ${{ secrets.E2E_BRIDGE_FEISHU_APP_SECRET }}
          E2E_BRIDGE_CHAT_ID: ${{ secrets.E2E_BRIDGE_CHAT_ID }}
          E2E_SIMULATOR_LLM_BASE_URL: ${{ secrets.E2E_SIMULATOR_LLM_BASE_URL }}
          E2E_SIMULATOR_LLM_API_KEY: ${{ secrets.E2E_SIMULATOR_LLM_API_KEY }}
          E2E_SIMULATOR_LLM_MODEL: ${{ secrets.E2E_SIMULATOR_LLM_MODEL }}
          E2E_EVALUATOR_LLM_BASE_URL: ${{ secrets.E2E_EVALUATOR_LLM_BASE_URL }}
          E2E_EVALUATOR_LLM_API_KEY: ${{ secrets.E2E_EVALUATOR_LLM_API_KEY }}
          E2E_EVALUATOR_LLM_MODEL: ${{ secrets.E2E_EVALUATOR_LLM_MODEL }}
        run: ./tests/e2e/backend_smoke/run.sh
      - name: Upload L3 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l3-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/im-align-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
